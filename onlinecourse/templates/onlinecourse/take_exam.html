<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ course.name }} mock exam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">{{ course.name }} mock exam</h1>
    <form method="post" action="{% url 'submit' course.id %}">
      {% csrf_token %}
      {% for question in course.questions.all %}
        <fieldset class="card mb-3">
          <div class="card-body">
            <legend class="h5">{{ forloop.counter }}. {{ question.content }}</legend>
            {% for choice in question.choices.all %}
              <div class="form-check">
                <input class="form-check-input" type="radio" name="question_{{ question.id }}" id="choice-{{ choice.id }}" value="{{ choice.id }}">
                <label class="form-check-label" for="choice-{{ choice.id }}">{{ choice.content }}</label>
              </div>
            {% endfor %}
          </div>
        </fieldset>
      {% empty %}
        <p>This course has no exam questions yet.</p>
      {% endfor %}
      <button class="btn btn-primary" type="submit">Submit exam</button>
    </form>
  </main>
</body>
</html>
